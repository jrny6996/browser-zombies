<!DOCTYPE html>
<html lang="en-us">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
        <title>Emscripten-Generated Code</title>

        <style>
            body {
                font-family: arial;
                margin: 0;
                padding: 0;
                background: #222;
            }

            .emscripten {
                display: block;
                margin-left: auto;
                margin-right: auto;
            }

            .emscripten_border {
                border: 1px solid black;
                width: fit-content;
                margin: auto;
            }

            canvas.emscripten {
                border: 0;
                background-color: black;

                /* Display size */
                width: 1280px;
                height: 720px;

                /* Prevent stretching issues */
                image-rendering: auto;
            }

            #status {
                text-align: center;
                margin: 10px;
                color: white;
            }

            #progress {
                display: block;
                margin: 10px auto;
                width: 300px;
            }

            #output {
                width: 100%;
                height: 150px;
                margin-top: 10px;
                background: black;
                color: white;
                font-family: monospace;
            }

            @media (max-width: 1280px) {
                canvas.emscripten {
                    width: 100vw;
                    height: auto;
                    aspect-ratio: 16 / 9;
                }
            }
        </style>
    </head>

    <body>
        <div id="status">Downloading...</div>

        <div class="emscripten">
            <progress value="0" max="100" id="progress"></progress>
        </div>

        <div class="emscripten_border">
            <canvas
                class="emscripten"
                id="canvas"
                width="1280"
                height="720"
                oncontextmenu="event.preventDefault()"
                tabindex="-1"
            >
            </canvas>
        </div>

        <textarea id="output"></textarea>

        <script>
            var canvasElement = document.getElementById(
                "canvas",
            );
            var outputElement = document.getElementById(
                "output",
            );
            var statusElement = document.getElementById(
                "status",
            );
            var progressElement = document.getElementById(
                "progress",
            );

            if (outputElement) {
                outputElement.value = "";
            }

            var Module = {
                canvas: canvasElement,

                print(...args) {
                    console.log(...args);

                    if (outputElement) {
                        outputElement.value += args.join(" ") +
                            "\n";
                        outputElement.scrollTop =
                            outputElement.scrollHeight;
                    }
                },

                setStatus(text) {
                    statusElement.innerHTML = text;
                },

                monitorRunDependencies(left) {
                    Module.setStatus(
                        left
                            ? "Preparing... (" + left + ")"
                            : "All downloads complete.",
                    );
                },
            };

            canvasElement.addEventListener(
                "webglcontextlost",
                function (e) {
                    alert(
                        "WebGL context lost. Reload the page.",
                    );
                    e.preventDefault();
                },
                false,
            );

            Module.setStatus("Downloading...");
        </script>

        {{{ SCRIPT }}}
    </body>
</html>
